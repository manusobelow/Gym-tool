<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png" type="image/png">
<title>Gym Reference</title>
<style>
  html, body { margin:0; padding:0; background:#131313; }
</style>
</head>
<body>
<div id="gym-ref-root">Loading…</div>
<style>
  #gym-ref-root {
    --bg: #131313; --surface: #1d1d1d; --surface-2: #262626; --line: #333333;
    --chalk: #f2f0ea; --muted: #8f8c86; --brand: #c8362a; --steel: #5b84b8;
    --green: #6fae6f; --red: #7a3b34;
    background: var(--bg); color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 60px;
  }
  #gym-ref-root * { box-sizing: border-box; }
  .grr-header { padding: 16px 16px 10px; border-bottom: 3px solid var(--brand); position: sticky; top: 0; background: var(--bg); z-index: 30; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .grr-title { font-size: 20px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; margin:0; }
  .grr-title .grr-title-accent { color: var(--brand); }
  .grr-navbtn { font-size: 11px; font-weight:700; text-transform:uppercase; color: var(--steel); border:1px solid var(--steel); border-radius:999px; padding:5px 10px; cursor:pointer; background:none; }
  .grr-section-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 12px 16px 6px; font-weight: 700; }
  .grr-equip-row { display:flex; flex-wrap:wrap; gap:6px; padding: 0 16px 10px; }
  .grr-chip { border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer; user-select:none; white-space:nowrap; }
  .grr-chip.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .grr-chip-all.active { background:var(--steel); color:#fff; border-color:var(--steel); }
  .grr-list { padding: 4px 16px 8px; display:flex; flex-direction:column; gap:8px; }
  .grr-card { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--steel); border-radius:4px; padding:10px 12px; cursor:pointer; }
  .grr-card.main { border-left-color: var(--brand); }
  .grr-card-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .grr-card-name { font-weight:700; font-size:14.5px; }
  .grr-badge { font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:3px; white-space:nowrap; background:var(--steel); color:#fff; }
  .grr-badge.main { background: var(--brand); color:#fff; }
  .grr-badge.mobility { background: #4a4a4a; }
  .grr-card-meta { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .grr-card-tm { font-size:11px; color:var(--brand); margin-top:4px; font-weight:700; }
  .grr-empty { color:var(--muted); font-size:13px; padding:24px 16px; text-align:center; }
  .grr-collapse { margin:10px 16px 0; border:1px solid var(--line); border-radius:4px; background:var(--surface); overflow:hidden; }
  .grr-collapse-head { padding:12px; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; display:flex; justify-content:space-between; cursor:pointer; color:var(--brand); }
  .grr-collapse-body { padding:0 12px 12px; font-size:12.5px; line-height:1.55; display:none; }
  .grr-collapse.open .grr-collapse-body { display:block; }
  .grr-collapse-body b { color:var(--brand); }
  .grr-row-pair { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); }
  .grr-row-pair:last-child { border-bottom:none; }

  .grr-detail { padding: 8px 16px 24px; }
  .grr-back { color: var(--steel); font-size:12px; font-weight:700; cursor:pointer; margin-bottom:10px; display:inline-block; }
  .grr-detail-name { font-size:20px; font-weight:800; }
  .grr-detail-meta { color:var(--muted); font-size:12.5px; margin-top:2px; margin-bottom:10px; }
  .grr-notes { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 12px; font-size:12.5px; color:var(--chalk); margin-bottom:12px; line-height:1.5; }
  .grr-gif { width:100%; border-radius:6px; margin-bottom:12px; display:block; background:var(--surface); }
  .grr-gif-frame { height:260px; border:1px solid var(--line); }
  .grr-gif-link { display:inline-block; margin-bottom:12px; color:var(--steel); font-size:12px; font-weight:700; }
  .grr-tm-box { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .grr-tm-box label { font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .grr-tm-box input { width:80px; background:var(--bg); border:1px solid var(--line); color:var(--chalk); font-size:15px; padding:6px 8px; border-radius:4px; text-align:right; }
  .grr-set-row { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
  .grr-set-row-top { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; font-weight:700;}
  .grr-set-inputs { display:flex; gap:8px; align-items:center; }
  .grr-set-inputs input { background:var(--bg); border:1px solid var(--line); color:var(--chalk); font-size:15px; padding:6px 8px; border-radius:4px; width:64px; text-align:center; }
  .grr-set-inputs .grr-unit { font-size:11px; color:var(--muted); }
  .grr-toggle { margin-left:auto; display:flex; gap:4px; }
  .grr-toggle button { border:1px solid var(--line); background:var(--bg); color:var(--muted); font-size:15px; width:36px; height:32px; border-radius:4px; cursor:pointer; }
  .grr-bw-btn { border:1px solid var(--line); background:var(--bg); color:var(--muted); font-size:10px; font-weight:800; padding:0 8px; height:32px; border-radius:4px; cursor:pointer; }
  .grr-bw-btn.active { background:var(--steel); border-color:var(--steel); color:#fff; }
  .grr-toggle button.on-yes { background:var(--green); color:#111; border-color:var(--green); }
  .grr-toggle button.on-no { background:var(--red); color:#111; border-color:var(--red); }
  .grr-save-btn { width:100%; background:var(--brand); color:#fff; border:none; font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:.04em; padding:12px; border-radius:6px; margin-top:6px; cursor:pointer; }
  .grr-save-msg { text-align:center; font-size:12px; color:var(--green); margin-top:8px; min-height:16px; }
  .grr-superset-box { margin-top:16px; }
  .grr-superset-chip { display:inline-block; background:var(--surface-2); border:1px solid var(--line); color:var(--chalk); font-size:12px; padding:5px 9px; border-radius:6px; margin:0 6px 6px 0; cursor:pointer; }
  .grr-superset-chip:active { background:var(--brand); border-color:var(--brand); color:#fff; }
  .grr-history { margin-top:16px; }
  .grr-history-row { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:6px 0; border-bottom:1px solid var(--line); }
  .grr-history-row span:last-child { color:var(--chalk); }

  .grr-export-btn { width:100%; background:var(--steel); color:#fff; border:none; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.04em; padding:12px; border-radius:6px; cursor:pointer; margin-bottom:8px; }
  .grr-copy-btn { width:100%; background:var(--surface); color:var(--chalk); border:1px solid var(--line); font-weight:700; font-size:13px; padding:10px; border-radius:6px; cursor:pointer; margin-bottom:14px; }
  .grr-log-entry { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
  .grr-log-entry-top { display:flex; justify-content:space-between; font-weight:700; font-size:13px; }
  .grr-log-entry-meta { font-size:11.5px; color:var(--muted); margin-top:2px; }
</style>

<script src="exercises.js?v=2"></script>
<script src="home-workouts.js?v=1"></script>
<script>
(function() {
  const root = document.getElementById('gym-ref-root');

  if (typeof EXERCISES === 'undefined') {
    root.innerHTML = '<div style="padding:24px;color:#f2f0ea;font-family:sans-serif;">Could not load exercises.js — make sure it is uploaded in the same folder as this file.</div>';
    return;
  }
  const HOME_DATA_LOADED = typeof LADDERS !== 'undefined';

  const PATTERNS = ["Squat","Hinge","Lunge","Push Horizontal","Pull Horizontal","Push Vertical","Pull Vertical","Core / Carry","Isolation","Warm-up / Mobility","Conditioning"];
  const EQUIP = ["barbell","dumbbell","kettlebell","cable","machine","bodyweight","band","trapbar","landmine","rings"];
  const EQUIP_LABEL = {barbell:"Barbell",dumbbell:"DB",kettlebell:"KB",cable:"Cable",machine:"Machine",bodyweight:"Bodyweight",band:"Band",trapbar:"Trap Bar",landmine:"Landmine",rings:"Rings"};
  const MUSCLE_LABELS = {
    'rear-delts':'Rear Delts','transverse-abdominal':'Transverse Abdominal','serratus':'Serratus',
    'quadratus-lumborum':'Quadratus Lumborum','side-delts':'Side Delts','upper-back':'Upper Back',
    'hip-flexors':'Hip Flexors','tibialis-anterior':'Tibialis Anterior','adductors':'Adductors',
    'lower-traps':'Lower Traps','hamstrings':'Hamstrings','mid-traps':'Mid Traps','abs':'Abs',
    'calves':'Calves','quads':'Quads','glute-max':'Glute Max','glute-med':'Glute Med','chest':'Chest',
    'neck':'Neck','forearms':'Forearms','biceps':'Biceps','obliques':'Obliques','front-delts':'Front Delts',
    'triceps':'Triceps','spinal-erectors':'Spinal Erectors','upper-traps':'Upper Traps','lats':'Lats',
    'teres-major':'Teres Major','rhomboids':'Rhomboids','rotator-cuff':'Rotator Cuff',
  };
  const ALL_MUSCLE_IDS = Object.keys(MUSCLE_LABELS);

  // Per-muscle volume landmarks (sets-equivalent per rolling 7 days), synthesized from Renaissance
  // Periodization's (Israetel/Helms) volume framework, itself a synthesis of the broader hypertrophy
  // dose-response literature (Schoenfeld et al.). Not directly-measured per-muscle constants — treat
  // as well-reasoned estimates. mav is stored for reference only; only mev/mrv drive coloring.
  const LANDMARK_CATEGORIES = {
    chest:            {mev:8,  mav:[12,20], mrv:22},
    back:             {mev:10, mav:[14,22], mrv:25},
    quads:            {mev:8,  mav:[12,18], mrv:20},
    hamstrings:       {mev:6,  mav:[10,16], mrv:20},
    glutes:           {mev:4,  mav:[8,12],  mrv:16},
    sideDelts:        {mev:8,  mav:[16,22], mrv:26},
    frontDelts:       {mev:3,  mav:[6,8],   mrv:12}, // borrowed floor — front delts get heavy incidental overlap from all pressing, low MEV is defensible per common coaching consensus
    rearDelts:        {mev:5,  mav:[12,16], mrv:20}, // borrowed floor — widely flagged by coaches as chronically undertrained despite incidental row/pull volume, floor raised accordingly
    biceps:           {mev:8,  mav:[14,20], mrv:26},
    triceps:          {mev:6,  mav:[10,14], mrv:18},
    calves:           {mev:8,  mav:[12,16], mrv:20},
    abs:              {mev:6,  mav:[16,20], mrv:25}, // borrowed floor — recovers fast, tolerates volume well; closer to RP's actual published ~6-8 MEV than a true zero-data estimate
    traps:            {mev:5,  mav:[12,16], mrv:20}, // borrowed floor — commonly under-trained relative to incidental shrug/pull volume, floor raised accordingly
    smallStabilizers: {mev:3,  mav:[8,12],  mrv:16}, // borrowed floor — most muscles in this bucket (QL, hip flexors, rotator cuff, tibialis, neck) are genuinely low-need; forearms is the one outlier sharing this bucket
  };
  const MUSCLE_TO_LANDMARK_CATEGORY = {
    'chest': 'chest',
    'lats': 'back', 'upper-back': 'back', 'rhomboids': 'back', 'teres-major': 'back', 'spinal-erectors': 'back',
    'quads': 'quads',
    'hamstrings': 'hamstrings',
    'glute-max': 'glutes', 'glute-med': 'glutes',
    'side-delts': 'sideDelts',
    'front-delts': 'frontDelts',
    'rear-delts': 'rearDelts',
    'biceps': 'biceps',
    'triceps': 'triceps',
    'calves': 'calves',
    'abs': 'abs', 'obliques': 'abs', 'transverse-abdominal': 'abs',
    'upper-traps': 'traps', 'mid-traps': 'traps', 'lower-traps': 'traps',
    'forearms': 'smallStabilizers', 'rotator-cuff': 'smallStabilizers', 'tibialis-anterior': 'smallStabilizers',
    'quadratus-lumborum': 'smallStabilizers', 'neck': 'smallStabilizers', 'adductors': 'smallStabilizers',
    'hip-flexors': 'smallStabilizers', 'serratus': 'smallStabilizers',
  };
  function landmarksFor(muscleId) {
    return LANDMARK_CATEGORIES[MUSCLE_TO_LANDMARK_CATEGORY[muscleId]];
  }
  const EX = EXERCISES;
  const EX_BY_ID = Object.fromEntries(EX.map(x => [x.id, x]));

  function targetsFor(x, tierState, hypState) {
    const scheme = effectiveScheme(x);
    const rep = REP_OVERRIDE[x.id] || {};
    if (scheme === 'main') {
      const lastPct = (tierState === '85') ? 0.85 : 0.80;
      const wr = rep.workingReps || 6;
      return [
        {label:'Warm-up', pct:0.50, reps:5},
        {label:'Set 1', pct:0.85, reps:wr},
        {label:'Set 2', pct:0.85, reps:wr},
        {label:'Set 3 (test set)', pct:lastPct, reps:wr, isTestSet:true},
      ];
    }
    if (scheme === 'strength') {
      const wr = rep.workingReps || 7;
      return [
        {label:'Warm-up', pct:0.50, reps:5},
        {label:'Set 1', pct:0.85, reps:wr},
        {label:'Set 2 (test set)', pct:0.85, reps:wr, isTestSet:true},
      ];
    }
    // hypertrophy
    const lo = rep.hypLow || 8;
    const hi = rep.hypHigh || 10;
    const tierKey = (hypState && hypState.tier) || 'low';
    const tierReps = tierKey === 'high' ? hi : lo;
    const w = (hypState && hypState.weight) || null;
    return [
      {label:'Set 1 (to failure)', reps:tierReps, fixedWeight:w, isMainHypSet:true},
      {label:'Set 2 (to failure)', reps:tierReps, fixedWeight:w, isMainHypSet:true},
      {label:'Set 3 — drop weight (to failure)', reps:hi, fixedWeight: w ? roundW(w*0.85) : null},
    ];
  }

  function roundW(w) { return Math.round(w/5)*5; }
  function friendlyDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    const wd = d.toLocaleDateString(undefined, {weekday:'short'});
    return `${wd} ${iso}`;
  }
  function formatDateLocal(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayLocal() {
    return formatDateLocal(new Date());
  }
  function newLogId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ---------- STATE ----------
  let state = { equip: new Set(EQUIP), pattern: new Set(PATTERNS), view: 'list', activeId: null, saveMsg: '', logFilter: '', muscleMapTarget: null, cameFrom: null, homeMode: false, homeMsg: '' };
  let TM = {};
  let TIER = {};
  let HYP = {};
  let SCHEME_OVERRIDE = {}; // { exId: 'main'|'strength'|'hypertrophy'|'mobility' } — overrides exercises.js default
  let REP_OVERRIDE = {};    // { exId: {mainReps, hypLow, hypHigh} } — overrides hardcoded rep targets

  // ---------- HOME WORKOUT STATE ----------
  let HOME = { majorDay: 'A', circuitDay: 1 };
  let PLATE_INVENTORY = HOME_DATA_LOADED ? {...DEFAULT_PLATE_INVENTORY} : {};
  let RUNG_STATE = {};   // { ladderKey: { rungIndex: 0, streak: 0 } }
  let CIRCUIT_TICKS = {}; // { exId: 0|1|2 } — 0=blank, 1=done, 2=max; no scheme/weight upgrade is tied to ticks
  let MAJOR_LIFT_STATE = {}; // { A: {sets:3, weight:null, streak:0, lastAmrap:null}, B: {...}, C: {...} }
  function saveMajorLiftState() { try { localStorage.setItem('gym-major-lift-state', JSON.stringify(MAJOR_LIFT_STATE)); } catch(e){} }
  function totalPlateWeight() {
    return Object.entries(PLATE_INVENTORY).reduce((sum,[size,pairs]) => sum + (parseFloat(size) * 2 * pairs), 0);
  }
  function currentRungId(ladderKey) {
    const ladder = LADDERS[ladderKey];
    const st = RUNG_STATE[ladderKey] || {rungIndex:0, streak:0};
    return ladder.rungs[Math.min(st.rungIndex, ladder.rungs.length-1)];
  }
  function isBodyweightOnly(x) { return x.eq.length === 1 && x.eq[0] === 'bodyweight'; }
  function effectiveScheme(x) {
    // Home Workout exercises are always Home Circuit exercises. A gym-page scheme
    // override must never leak into a ladder rung, isolation station, or daily superset.
    if (HOME_DATA_LOADED && isHomeWorkoutExercise(x.id)) return 'circuit';
    return SCHEME_OVERRIDE[x.id] || x.scheme;
  }
  function schemeChoicesFor(x) {
    const choices = new Set(['main','strength','hypertrophy']);
    if (isBodyweightOnly(x)) choices.add('mobility');
    choices.add(x.scheme); // always keep the original default reachable, even if it wouldn't otherwise qualify
    return [...choices];
  }
  const SCHEME_LABELS = {main:'Major Lift', strength:'Strength', hypertrophy:'Hypertrophy', mobility:'Mobility', circuit:'Home Circuit'};
  function buildSchemePickerHtml(x, scheme) {
    return `
      <div class="grr-section-label" style="padding-left:0;">Scheme</div>
      <div class="grr-equip-row" id="grr-scheme-picker" style="padding:0 0 10px;">
        ${schemeChoicesFor(x).map(s => `<div class="grr-chip${scheme===s?' active':''}" data-scheme="${s}">${SCHEME_LABELS[s]}</div>`).join('')}
      </div>`;
  }
  function wireSchemePicker(x) {
    root.querySelectorAll('#grr-scheme-picker .grr-chip').forEach(chip => {
      chip.onclick = () => {
        const s = chip.dataset.scheme;
        if (s === x.scheme) delete SCHEME_OVERRIDE[x.id]; else SCHEME_OVERRIDE[x.id] = s;
        saveSchemeOverride(); clearDraft(x.id); state.saveMsg = ''; render();
      };
    });
  }
  let LOGS = {};
  let DRAFTS = {}; // in-progress, unsaved set inputs per exercise id — survives navigating away and back

  function loadAll() {
    try { const a = JSON.parse(localStorage.getItem('gym-ref-equip')); if (a && a.length) state.equip = new Set(a); } catch(e){}
    try { const a = JSON.parse(localStorage.getItem('gym-ref-pattern')); if (a) state.pattern = new Set(a); } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-tm')); if (v) TM = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-tier')); if (v) TIER = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-hyp')); if (v) HYP = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-scheme-override')); if (v) SCHEME_OVERRIDE = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-rep-override')); if (v) REP_OVERRIDE = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-home-state')); if (v) HOME = {...HOME, majorDay: v.majorDay || HOME.majorDay, circuitDay: v.circuitDay || HOME.circuitDay}; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-plate-inventory')); if (v) PLATE_INVENTORY = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-rung-state')); if (v) RUNG_STATE = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-circuit-ticks')); if (v) CIRCUIT_TICKS = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-major-lift-state')); if (v) MAJOR_LIFT_STATE = v; } catch(e){}
    Object.keys(HYP).forEach(id => {
      if (HYP[id].tier === '6-8' || HYP[id].tier === 8) HYP[id].tier = 'low';
      else if (HYP[id].tier === '8-10' || HYP[id].tier === 10) HYP[id].tier = 'high';
    });
    try { const v = JSON.parse(localStorage.getItem('gym-logs')); if (v) LOGS = v; } catch(e){}
    try { const v = JSON.parse(localStorage.getItem('gym-drafts')); if (v) DRAFTS = v; } catch(e){}
    Object.keys(LOGS).forEach(exId => {
      (LOGS[exId] || []).forEach((e, i) => {
        if (!e.exId) e.exId = exId;
        if (!e.logId) e.logId = exId + '-' + i;
      });
    });
    render();
  }
  function saveEquip() { try { localStorage.setItem('gym-ref-equip', JSON.stringify([...state.equip])); } catch(e){} }
  function savePattern() { try { localStorage.setItem('gym-ref-pattern', JSON.stringify([...state.pattern])); } catch(e){} }
  function saveTM() { try { localStorage.setItem('gym-tm', JSON.stringify(TM)); } catch(e){} }
  function saveTier() { try { localStorage.setItem('gym-tier', JSON.stringify(TIER)); } catch(e){} }
  function saveHyp() { try { localStorage.setItem('gym-hyp', JSON.stringify(HYP)); } catch(e){} }
  function saveSchemeOverride() { try { localStorage.setItem('gym-scheme-override', JSON.stringify(SCHEME_OVERRIDE)); } catch(e){} }
  function saveRepOverride() { try { localStorage.setItem('gym-rep-override', JSON.stringify(REP_OVERRIDE)); } catch(e){} }
  function saveHome() { try { localStorage.setItem('gym-home-state', JSON.stringify(HOME)); } catch(e){} }
  function savePlateInventory() { try { localStorage.setItem('gym-plate-inventory', JSON.stringify(PLATE_INVENTORY)); } catch(e){} }
  function saveRungState() { try { localStorage.setItem('gym-rung-state', JSON.stringify(RUNG_STATE)); } catch(e){} }
  function saveCircuitTicks() { try { localStorage.setItem('gym-circuit-ticks', JSON.stringify(CIRCUIT_TICKS)); } catch(e){} }
  function saveLogs() { try { localStorage.setItem('gym-logs', JSON.stringify(LOGS)); } catch(e){} }
  function saveDrafts() { try { localStorage.setItem('gym-drafts', JSON.stringify(DRAFTS)); } catch(e){} }
  function updateDraft(exId, i, field, value) {
    if (!DRAFTS[exId]) DRAFTS[exId] = {};
    if (!DRAFTS[exId][i]) DRAFTS[exId][i] = {};
    DRAFTS[exId][i][field] = value;
    saveDrafts();
  }
  function clearDraft(exId) { delete DRAFTS[exId]; saveDrafts(); }
  function deleteLogEntry(exId, logId) {
    if (!LOGS[exId]) return;
    LOGS[exId] = LOGS[exId].filter(e => e.logId !== logId);
    saveLogs();
  }

  function toggleEquip(e) { state.equip.has(e) ? state.equip.delete(e) : state.equip.add(e); saveEquip(); render(); }
  function setAllEquip(on) { state.equip = on ? new Set(EQUIP) : new Set(); saveEquip(); render(); }
  function togglePattern(p) { state.pattern.has(p) ? state.pattern.delete(p) : state.pattern.add(p); savePattern(); render(); }
  function setAllPatterns(on) { state.pattern = on ? new Set(PATTERNS) : new Set(); savePattern(); render(); }
  function activePatterns() { return state.pattern.size ? state.pattern : new Set(PATTERNS); }

  function supersetSuggestions(x) {
    if (effectiveScheme(x) === 'main') return {note:"Major lifts are best done alone — don't superset these.", list:[]};
    const myMuscles = new Set(x.muscles.map(m => m.id));
    const list = EX.filter(o =>
      o.id !== x.id &&
      effectiveScheme(o) !== 'main' &&
      effectiveScheme(o) !== 'circuit' &&
      o.eq.some(e => state.equip.has(e)) &&
      !o.muscles.some(m => myMuscles.has(m.id))
    );
    return {note: null, list};
  }

  function gifBlock(x) {
    if (!x.gif) return '';
    const driveMatch = x.gif.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
    if (driveMatch) {
      const fileId = driveMatch[1];
      return `<iframe class="grr-gif grr-gif-frame" src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay" loading="lazy"></iframe>`;
    }
    if (/\.mp4(\?|$)/i.test(x.gif)) {
      return `<video class="grr-gif" src="${x.gif}" autoplay loop muted playsinline onerror="this.style.display='none'"></video>`;
    }
    return `<img class="grr-gif" src="${x.gif}" alt="${x.n} demo" loading="lazy" onerror="this.style.display='none'"/>`;
  }

  // ---------- RENDER: LIST VIEW ----------
  function buildCard(x, cameFrom) {
    const card = document.createElement('div');
    const scheme = effectiveScheme(x);
    card.className = 'grr-card ' + scheme;
    const schemeLabel = {main:'Major Lift', strength:'Strength', hypertrophy:'Hypertrophy', mobility:'Mobility', circuit:'Home Circuit'}[scheme];
    const badgeClass = scheme === 'main' ? 'main' : scheme === 'mobility' ? 'mobility' : '';
    const tmLine = (scheme !== 'hypertrophy' && scheme !== 'mobility' && TM[x.id]) ? `<div class="grr-card-tm">1RM: ${TM[x.id]} lb</div>` : '';
    card.innerHTML = `
      <div class="grr-card-top">
        <div class="grr-card-name">${x.n}</div>
        <div class="grr-badge ${badgeClass}">${schemeLabel}</div>
      </div>
      <div class="grr-card-meta">${x.m}</div>
      ${tmLine}
    `;
    card.onclick = () => { state.cameFrom = cameFrom || null; state.view = 'detail'; state.activeId = x.id; state.saveMsg=''; render(); };
    return card;
  }

  function renderList() {
    const pats = activePatterns();
    root.innerHTML = `
      <div class="grr-header">
        <div class="grr-title">GYM <span class="grr-title-accent">REFERENCE</span></div>
        <div style="display:flex;gap:6px;">
          <button class="grr-navbtn" id="grr-goto-muscles">Muscle Map</button>
          <button class="grr-navbtn" id="grr-goto-home">Home Workout</button>
          <button class="grr-navbtn" id="grr-goto-history">Log / Export</button>
        </div>
      </div>
      <div class="grr-section-label">Equipment here today</div>
      <div class="grr-equip-row" id="grr-equip-row">
        <div class="grr-chip grr-chip-all" data-all="1">ALL</div>
        <div class="grr-chip grr-chip-all" data-none="1">NONE</div>
      </div>
      <div class="grr-section-label">Movement pattern</div>
      <div class="grr-equip-row" id="grr-pattern-row">
        <div class="grr-chip grr-chip-all" data-pall="1">ALL</div>
        <div class="grr-chip grr-chip-all" data-pnone="1">NONE</div>
      </div>
      <div class="grr-list" id="grr-list"></div>
      <div class="grr-collapse" id="grr-superset">
        <div class="grr-collapse-head">Superset pairing guide ▾</div>
        <div class="grr-collapse-body">
          <b>Only Major Lifts are off-limits for supersetting</b> — everything else is fair game as long as the two exercises don't share a targeted muscle. Antagonist or unrelated pairs both work fine, e.g. Chin-Ups + Cossack Squat is fine (no overlap); Chin-Ups + Bicep Curl is not (both hit biceps).<br/><br/>
          <b>Good pairing examples:</b><br/>
          <div class="grr-row-pair"><span>Horizontal Push</span><span>↔ Horizontal Pull</span></div>
          <div class="grr-row-pair"><span>Vertical Push</span><span>↔ Vertical Pull</span></div>
          <div class="grr-row-pair"><span>DB / EZ Curl</span><span>↔ Triceps Pushdown</span></div>
          <div class="grr-row-pair"><span>Face Pull</span><span>↔ Pallof Press</span></div>
          <br/>Each exercise page shows live "Goes well with" suggestions computed from this exact rule, filtered to your current equipment.
        </div>
      </div>
      <div class="grr-collapse" id="grr-template">
        <div class="grr-collapse-head">Workout A / B template ▾</div>
        <div class="grr-collapse-body">
          <b>Workout A</b> — Squat + Horizontal Push + Vertical Pull + Core<br/>
          <b>Workout B</b> — Hinge/Lunge + Horizontal Pull + Vertical Push + Core<br/><br/>
          Alternate A/B each session. Don't stack both vertical push and vertical pull in one workout.
        </div>
      </div>
      <div class="grr-collapse" id="grr-scheme">
        <div class="grr-collapse-head">Scheme reference ▾</div>
        <div class="grr-collapse-body">
          <b>Strength — 2–3 min rest.</b> Warm-up 5@50%, Set 1 6@85%, Set 2 6@85%. Major lifts add a 3rd (test) set: starts at 80%, moves to 85% next session once hit. Hit the test set at 85% → your 1RM goes up (+5 lb lower body, +2.5 lb upper body), test set resets to 80%.<br/><br/>
          <b>Major lifts:</b> Squat, Deadlift, BB Bench Press / JM Press, BB Overhead Press, Weighted Pull-up, Barbell Row, Hip Thrust, Lunge Carries.<br/><br/>
          <b>Hypertrophy — 1 min rest, drop set.</b> Sets 1–2 to failure, target starts at 8 reps. Set 3 drops the weight, targets 10 reps to failure. Hit sets 1–2 at 8 → next session the target becomes 10 at the same weight. Hit 10 → add weight, target resets to 8.<br/><br/>
          <b>Mobility/Warm-up.</b> No weight tracked — just marked done for the day.
        </div>
      </div>
    `;

    const eqRow = root.querySelector('#grr-equip-row');
    EQUIP.forEach(e => {
      const chip = document.createElement('div');
      chip.className = 'grr-chip' + (state.equip.has(e) ? ' active' : '');
      chip.textContent = EQUIP_LABEL[e];
      chip.onclick = () => toggleEquip(e);
      eqRow.appendChild(chip);
    });
    eqRow.querySelector('[data-all]').onclick = () => setAllEquip(true);
    eqRow.querySelector('[data-none]').onclick = () => setAllEquip(false);

    const patRow = root.querySelector('#grr-pattern-row');
    PATTERNS.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'grr-chip' + (state.pattern.has(p) ? ' active' : '');
      chip.textContent = p;
      chip.onclick = () => togglePattern(p);
      patRow.appendChild(chip);
    });
    patRow.querySelector('[data-pall]').onclick = () => setAllPatterns(true);
    patRow.querySelector('[data-pnone]').onclick = () => setAllPatterns(false);

    const list = root.querySelector('#grr-list');
    list.innerHTML = '';
    let anyShown = false;
    PATTERNS.filter(p => pats.has(p)).forEach(p => {
      const group = EX.filter(x => x.p === p && x.scheme !== 'circuit' && x.eq.some(e => state.equip.has(e)));
      if (!group.length) return;
      anyShown = true;
      group.sort((a,b) => (effectiveScheme(a) === effectiveScheme(b) ? 0 : effectiveScheme(a) === 'main' ? -1 : 1));
      const header = document.createElement('div');
      header.className = 'grr-section-label';
      header.style.padding = '10px 0 4px';
      header.textContent = p;
      list.appendChild(header);
      group.forEach(x => list.appendChild(buildCard(x)));
    });
    if (!anyShown) list.innerHTML = `<div class="grr-empty">No matches with the equipment selected.</div>`;

    ['grr-superset','grr-template','grr-scheme'].forEach(id => {
      const el = root.querySelector('#' + id);
      el.querySelector('.grr-collapse-head').onclick = () => el.classList.toggle('open');
    });
    root.querySelector('#grr-goto-history').onclick = () => { state.view = 'log'; render(); };
    root.querySelector('#grr-goto-muscles').onclick = () => { state.view = 'muscles'; render(); };
    root.querySelector('#grr-goto-home').onclick = () => { state.view = 'home'; render(); };
  }

  // ---------- RENDER: DETAIL VIEW (mobility) ----------
  function backButtonHtml() {
    if (state.cameFrom && state.cameFrom.view === 'home') {
      return `<span class="grr-back" id="grr-back">← Back to Home Workout</span>`;
    }
    let html = `<span class="grr-back" id="grr-back">← Back to list</span>`;
    if (state.cameFrom) {
      if (state.cameFrom.view === 'muscles') {
        html += ` &nbsp; <span class="grr-back" id="grr-back-ctx">← Back to Muscle Map</span>`;
      } else if (state.cameFrom.view === 'detail' && EX_BY_ID[state.cameFrom.activeId]) {
        html += ` &nbsp; <span class="grr-back" id="grr-back-ctx">← Back to ${EX_BY_ID[state.cameFrom.activeId].n}</span>`;
      }
    }
    return html;
  }
  function wireBackButtons() {
    root.querySelector('#grr-back').onclick = () => {
      const cf = state.cameFrom; state.cameFrom = null; state.homeMode = false;
      if (cf && cf.view === 'home') { state.view = 'home'; } else { state.view = 'list'; }
      render();
    };
    const ctx = root.querySelector('#grr-back-ctx');
    if (ctx) ctx.onclick = () => {
      const cf = state.cameFrom; state.cameFrom = null;
      if (cf.view === 'muscles') { state.muscleMapTarget = cf.muscleMapTarget; state.view = 'muscles'; }
      else if (cf.view === 'detail') { state.activeId = cf.activeId; state.view = 'detail'; }
      render();
    };
  }

  function renderMobilityDetail(x) {
    const hist = (LOGS[x.id] || []).slice(-6).reverse();
    const histHtml = hist.length ? hist.map(l => `<div class="grr-history-row"><span>${friendlyDate(l.date)}</span><span>✅ Done</span></div>`).join('')
      : `<div style="color:var(--muted);font-size:12px;">Not logged yet.</div>`;

    root.innerHTML = `
      <div class="grr-detail">
        ${backButtonHtml()}
        <div class="grr-detail-name">${x.n}</div>
        <div class="grr-detail-meta">${x.p} · ${x.m}</div>
        ${gifBlock(x)}
        ${x.notes ? `<div class="grr-notes">${x.notes}</div>` : ''}
        ${buildSchemePickerHtml(x, 'mobility')}
        <button class="grr-save-btn" id="grr-save">Mark Done Today</button>
        <div class="grr-save-msg">${state.saveMsg}</div>
        <div class="grr-section-label" style="padding-left:0;">Recent history</div>
        <div class="grr-history">${histHtml}</div>
      </div>
    `;
    wireBackButtons();
    wireSchemePicker(x);
    root.querySelector('#grr-save').onclick = () => {
      const entry = {date: todayLocal(), exercise: x.n, pattern: x.p, exId: x.id, logId: newLogId(), sets:[{target:'Done', weight:null, reps:null, success:true}], allSuccess:true, tmAction:'none'};
      if (!LOGS[x.id]) LOGS[x.id] = [];
      LOGS[x.id].push(entry);
      saveLogs();
      state.saveMsg = 'Marked done for today.';
      render();
    };
  }

  // ---------- RENDER: DETAIL VIEW ----------
  function renderDetail() {
    const x = EX_BY_ID[state.activeId];
    const scheme = effectiveScheme(x);
    // Circuit-scheme exercises ALWAYS use the Home Workout rendering, no matter how you reached them —
    // not just when arriving via the Home Workout page's own click handlers. Closes the leak where
    // Muscle Map / superset suggestions could surface one and render it with the wrong scheme entirely.
    if (scheme === 'circuit' || (state.homeMode && isHomeWorkoutExercise(x.id))) { renderHomeDetail(x); return; }
    if (scheme === 'mobility') { renderMobilityDetail(x); return; }

    const tm = TM[x.id] || null;
    const tierState = TIER[x.id] || '80';
    const hypState = HYP[x.id] || {weight: null, tier: 'low'};
    const targets = targetsFor(x, tierState, hypState);
    const ss = supersetSuggestions(x);
    const hist = (LOGS[x.id] || []).slice(-5).reverse();

    const draft = DRAFTS[x.id] || {};
    const rep = REP_OVERRIDE[x.id] || {};
    let setsHtml = targets.map((t,i) => {
      let weightGuess = '';
      if (t.pct) weightGuess = tm ? roundW(tm * t.pct) : '';
      if (t.fixedWeight !== undefined) weightGuess = t.fixedWeight || '';
      const pctLabel = t.pct ? Math.round(t.pct*100)+'% · ' : '';
      const d = draft[i] || {};
      const isBW = d.weight === 'BW';
      const weightVal = isBW ? '' : (d.weight !== undefined ? d.weight : weightGuess);
      const repsVal = d.reps !== undefined ? d.reps : (typeof t.reps === 'number' ? t.reps : '');
      const successVal = d.success; // true, false, or undefined
      return `
        <div class="grr-set-row" data-i="${i}">
          <div class="grr-set-row-top"><span>${t.label}</span><span>${pctLabel}${t.reps} reps</span></div>
          <div class="grr-set-inputs">
            <input type="number" class="grr-weight-input" placeholder="lb" value="${weightVal}" ${isBW ? 'disabled' : ''}/>
            <span class="grr-unit">lb</span>
            <button type="button" class="grr-bw-btn${isBW ? ' active' : ''}" data-i="${i}">BW</button>
            <input type="number" class="grr-reps-input" placeholder="reps" value="${repsVal}"/>
            <span class="grr-unit">reps</span>
            <div class="grr-toggle">
              <button class="grr-yes${successVal===true?' on-yes':''}" data-i="${i}">✓</button>
              <button class="grr-no${successVal===false?' on-no':''}" data-i="${i}">✗</button>
            </div>
          </div>
        </div>`;
    }).join('');

    let ssHtml = '';
    if (ss.note) ssHtml = `<div class="grr-collapse-body" style="display:block;padding:0;color:var(--muted)">${ss.note}</div>`;
    else if (ss.list.length) ssHtml = ss.list.map(o => `<span class="grr-superset-chip" data-id="${o.id}">${o.n}</span>`).join('');
    else ssHtml = `<div style="color:var(--muted);font-size:12px;">No matching partner exercise with current equipment.</div>`;

    let histHtml = hist.length ? hist.map(l => `
      <div class="grr-history-row"><span>${friendlyDate(l.date)}</span><span>${l.sets.map(s=>s.success?'✅':'❌').join('')} ${l.tmAction==='increase'?'⬆️':''}</span></div>
    `).join('') : `<div style="color:var(--muted);font-size:12px;">No sessions logged yet.</div>`;

    const schemeLabels = {main:'Major Lift', strength:'Strength', hypertrophy:'Hypertrophy', mobility:'Mobility', circuit:'Home Circuit'};
    const schemePickerHtml = buildSchemePickerHtml(x, scheme);

    const repOverrideHtml = scheme === 'hypertrophy' ? `
      <div class="grr-tm-box">
        <div><label>Rep Range</label><div style="font-size:11px;color:var(--muted);margin-top:2px;">Low → High before weight increases</div></div>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="number" id="grr-rep-lo" value="${rep.hypLow || 8}" style="width:50px;background:var(--bg);border:1px solid var(--line);color:var(--chalk);padding:6px;border-radius:4px;text-align:center;font-size:15px;"/>
          <span style="color:var(--muted);">–</span>
          <input type="number" id="grr-rep-hi" value="${rep.hypHigh || 10}" style="width:50px;background:var(--bg);border:1px solid var(--line);color:var(--chalk);padding:6px;border-radius:4px;text-align:center;font-size:15px;"/>
        </div>
      </div>` : `
      <div class="grr-tm-box">
        <div><label>Reps per set</label></div>
        <input type="number" id="grr-rep-working" value="${rep.workingReps || (scheme==='main'?6:7)}" style="width:60px;"/>
      </div>`;

    root.innerHTML = `
      <div class="grr-detail">
        ${backButtonHtml()}
        <div class="grr-detail-name">${x.n}</div>
        <div class="grr-detail-meta">${x.p} · ${x.m}</div>
        ${gifBlock(x)}
        ${x.notes ? `<div class="grr-notes">${x.notes}</div>` : ''}

        ${schemePickerHtml}

        <div class="grr-tm-box" style="flex-wrap:wrap;">
          <div>
            <label>1RM</label>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">${scheme==='main' ? `Test set currently at ${tierState}%` : scheme==='strength' ? 'Rest 2–3 min between sets' : 'Reference number — not used while in Hypertrophy mode'}</div>
          </div>
          <input type="number" id="grr-tm-input" value="${tm || ''}" placeholder="e.g. 135"/>
        </div>
        <div style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin:-8px 0 14px;padding:0 2px;">
          <span>or calculate from a set:</span>
          <input type="number" id="grr-calc-weight" placeholder="lb" style="width:52px;background:var(--surface);border:1px solid var(--line);color:var(--chalk);padding:5px;border-radius:4px;text-align:center;"/>
          <span>×</span>
          <input type="number" id="grr-calc-reps" placeholder="reps" style="width:48px;background:var(--surface);border:1px solid var(--line);color:var(--chalk);padding:5px;border-radius:4px;text-align:center;"/>
          <button type="button" id="grr-calc-btn" style="background:var(--steel);color:#fff;border:none;font-size:11px;font-weight:700;padding:6px 10px;border-radius:4px;cursor:pointer;">Calculate</button>
        </div>

        <div class="grr-tm-box">
          <div>
            <label>Working Weight</label>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">${scheme==='hypertrophy' ? `Rep target currently ${hypState.tier === 'high' ? (rep.hypHigh||10) : (rep.hypLow||8)} reps · rest 1 min` : 'Used only while in Hypertrophy mode'}</div>
          </div>
          <input type="number" id="grr-hyp-weight-input" value="${hypState.weight || ''}" placeholder="e.g. 40"/>
        </div>

        ${repOverrideHtml}

        <div id="grr-sets">${setsHtml}</div>
        <button class="grr-save-btn" id="grr-save">Save Today's Log</button>
        <div class="grr-save-msg">${state.saveMsg}</div>

        <div class="grr-collapse" id="grr-superset-collapse" style="margin:10px 0 14px;">
          <div class="grr-collapse-head">Goes well with ▾</div>
          <div class="grr-collapse-body" style="padding:0 0 12px;">
            <div class="grr-superset-box">${ssHtml}</div>
          </div>
        </div>

        <div class="grr-section-label" style="padding-left:0;">Recent history</div>
        <div class="grr-history">${histHtml}</div>
      </div>
    `;

    wireBackButtons();
    root.querySelector('#grr-superset-collapse .grr-collapse-head').onclick = () => {
      root.querySelector('#grr-superset-collapse').classList.toggle('open');
    };
    root.querySelectorAll('.grr-superset-chip').forEach(chip => {
      chip.onclick = () => { state.cameFrom = {view:'detail', activeId: x.id}; state.view = 'detail'; state.activeId = chip.dataset.id; state.saveMsg = ''; render(); };
    });

    wireSchemePicker(x);

    root.querySelector('#grr-tm-input').onchange = (e) => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v > 0) { TM[x.id] = v; saveTM(); render(); }
    };
    root.querySelector('#grr-hyp-weight-input').onchange = (e) => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v > 0) { HYP[x.id] = {weight: v, tier: hypState.tier}; saveHyp(); render(); }
    };
    root.querySelector('#grr-calc-btn').onclick = () => {
      const w = parseFloat(document.getElementById('grr-calc-weight').value);
      const r = parseFloat(document.getElementById('grr-calc-reps').value);
      if (w > 0 && r > 0) {
        const est = roundW(w * (1 + r/30)); // Epley formula estimate
        TM[x.id] = est; saveTM(); render();
      }
    };

    if (scheme === 'hypertrophy') {
      const lo = document.getElementById('grr-rep-lo'), hi = document.getElementById('grr-rep-hi');
      lo.onchange = () => { const v = parseInt(lo.value,10); if (v>0) { if (!REP_OVERRIDE[x.id]) REP_OVERRIDE[x.id]={}; REP_OVERRIDE[x.id].hypLow = v; saveRepOverride(); render(); } };
      hi.onchange = () => { const v = parseInt(hi.value,10); if (v>0) { if (!REP_OVERRIDE[x.id]) REP_OVERRIDE[x.id]={}; REP_OVERRIDE[x.id].hypHigh = v; saveRepOverride(); render(); } };
    } else {
      const wr = document.getElementById('grr-rep-working');
      wr.onchange = () => { const v = parseInt(wr.value,10); if (v>0) { if (!REP_OVERRIDE[x.id]) REP_OVERRIDE[x.id]={}; REP_OVERRIDE[x.id].workingReps = v; saveRepOverride(); render(); } };
    }

    root.querySelectorAll('.grr-weight-input').forEach((inp, i) => {
      inp.oninput = () => updateDraft(x.id, i, 'weight', inp.value);
    });
    root.querySelectorAll('.grr-reps-input').forEach((inp, i) => {
      inp.oninput = () => updateDraft(x.id, i, 'reps', inp.value);
    });
    root.querySelectorAll('.grr-bw-btn').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.i, 10);
        const wInput = root.querySelector(`.grr-set-row[data-i="${i}"] .grr-weight-input`);
        const nowBW = !btn.classList.contains('active');
        if (nowBW) { wInput.value = ''; wInput.disabled = true; updateDraft(x.id, i, 'weight', 'BW'); }
        else { wInput.disabled = false; updateDraft(x.id, i, 'weight', ''); }
        btn.classList.toggle('active', nowBW);
      };
    });
    root.querySelectorAll('.grr-yes').forEach(b => b.onclick = () => {
      b.classList.add('on-yes'); b.parentElement.querySelector('.grr-no').classList.remove('on-no');
      updateDraft(x.id, parseInt(b.dataset.i, 10), 'success', true);
    });
    root.querySelectorAll('.grr-no').forEach(b => b.onclick = () => {
      b.classList.add('on-no'); b.parentElement.querySelector('.grr-yes').classList.remove('on-yes');
      updateDraft(x.id, parseInt(b.dataset.i, 10), 'success', false);
    });

    root.querySelector('#grr-save').onclick = () => {
      const rows = root.querySelectorAll('.grr-set-row');
      const sets = [];
      rows.forEach((row, i) => {
        const wInput = row.querySelector('.grr-weight-input');
        const w = wInput.disabled ? 'BW' : (parseFloat(wInput.value) || null);
        const r = parseFloat(row.querySelector('.grr-reps-input').value) || null;
        const success = row.querySelector('.grr-yes').classList.contains('on-yes');
        sets.push({target: targets[i].label, weight: w, reps: r, success});
      });
      let msg = 'Saved.';
      const workingIdxs = targets.map((t,i)=>i).filter(i => targets[i].label !== 'Warm-up');
      const allWorkingOK = workingIdxs.length && workingIdxs.every(i => sets[i] && sets[i].success);

      if (scheme === 'main' && tm) {
        if (allWorkingOK) {
          if (tierState === '80') {
            TIER[x.id] = '85'; saveTier();
            msg = 'Saved. All working sets hit at 80% — next session the test set moves to 85%.';
          } else {
            const inc = x.region === 'lower' ? 5 : 2.5;
            TM[x.id] = tm + inc; TIER[x.id] = '80';
            saveTM(); saveTier();
            msg = `Saved. All working sets hit at 85% — 1RM bumped to ${TM[x.id]} lb, test set resets to 80%.`;
          }
        } else {
          msg = 'Saved. Not all working sets hit — no change. If the earlier sets failed but the last one succeeded, that likely means the weight was too high, not that it should go up.';
        }
      } else if (scheme === 'strength' && tm) {
        if (allWorkingOK) {
          const inc = x.region === 'lower' ? 5 : 2.5;
          TM[x.id] = tm + inc; saveTM();
          msg = `Saved. Both sets hit — 1RM bumped to ${TM[x.id]} lb.`;
        } else {
          msg = 'Saved. Not all sets hit — no change.';
        }
      } else if (scheme === 'hypertrophy') {
        const mainHypIdx = targets.map((t,i)=>t.isMainHypSet?i:-1).filter(i=>i>=0);
        const mainHypOK = mainHypIdx.length && mainHypIdx.every(i => sets[i] && sets[i].success);
        if (mainHypOK && hypState.weight) {
          if (hypState.tier !== 'high') {
            HYP[x.id] = {weight: hypState.weight, tier: 'high'}; saveHyp();
            msg = `Saved. Sets 1-2 complete — rep target moves to ${rep.hypHigh||10} next session.`;
          } else {
            const inc = x.region === 'lower' ? 5 : 2.5;
            HYP[x.id] = {weight: hypState.weight + inc, tier: 'low'}; saveHyp();
            msg = `Saved. Hit ${rep.hypHigh||10} reps — weight bumped to ${HYP[x.id].weight} lb, rep target resets to ${rep.hypLow||8}.`;
          }
        }
      }

      const entry = {date: todayLocal(), exercise: x.n, pattern: x.p, exId: x.id, logId: newLogId(), sets, allSuccess: sets.every(s=>s.success), tmAction: msg.includes('bumped') ? 'increase' : 'none'};
      if (!LOGS[x.id]) LOGS[x.id] = [];
      LOGS[x.id].push(entry);
      saveLogs();
      clearDraft(x.id);
      state.saveMsg = msg;
      render();
    };
  }

  // ---------- RENDER: LOG / EXPORT VIEW ----------
  function toCSV(entries) {
    const rows = [];
    entries.sort((a,b)=>a.date.localeCompare(b.date)).forEach(entry => {
      const exObj = EX.find(x => x.n === entry.exercise);
      const isBodyweightOnly = exObj && exObj.eq.length === 1 && exObj.eq[0] === 'bodyweight';
      const isMobility = exObj && effectiveScheme(exObj) === 'mobility';
      entry.sets.forEach(s => {
        let weight, reps;
        if (isMobility) {
          weight = 'BW/time';
          reps = 'Done';
        } else {
          const hasWeight = s.weight !== null && s.weight !== undefined && s.weight !== '';
          weight = hasWeight ? s.weight : (isBodyweightOnly ? 'BW' : '');
          reps = (s.reps !== null && s.reps !== undefined && s.reps !== '') ? s.reps : '';
        }
        rows.push([entry.date, entry.exercise, weight, reps]);
      });
    });
    return rows.map(r => r.join('\t')).join('\n');
  }

  function renderLog() {
    const allEntries = Object.values(LOGS).flat().sort((a,b) => b.date.localeCompare(a.date));

    root.innerHTML = `
      <div class="grr-detail">
        <span class="grr-back" id="grr-back">← Back to list</span>
        <div class="grr-detail-name">Log &amp; Export</div>
        <div class="grr-detail-meta">${allEntries.length} sessions logged</div>
        <input type="text" id="grr-log-filter" placeholder="Filter by exercise name…" value="${state.logFilter}"
          style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--chalk);font-size:14px;padding:9px 10px;border-radius:6px;margin-bottom:10px;box-sizing:border-box;"/>
        <button class="grr-export-btn" id="grr-download">Download CSV (all)</button>
        <button class="grr-copy-btn" id="grr-copy">Copy CSV to clipboard</button>
        <div class="grr-save-msg" id="grr-log-msg"></div>
        <div id="grr-entries"></div>
      </div>
    `;
    root.querySelector('#grr-back').onclick = () => { state.view = 'list'; render(); };

    function currentFiltered() {
      const filterText = state.logFilter.trim().toLowerCase();
      return filterText ? allEntries.filter(e => e.exercise.toLowerCase().includes(filterText)) : allEntries;
    }

    function refreshEntries() {
      const filterText = state.logFilter.trim().toLowerCase();
      const filtered = currentFiltered();
      root.querySelector('#grr-copy').textContent = filterText
        ? `Copy CSV to clipboard (${filtered.length} matching)`
        : `Copy CSV to clipboard (all ${allEntries.length})`;

      const container = root.querySelector('#grr-entries');
      container.innerHTML = '';
      if (!filtered.length) {
        container.innerHTML = `<div class="grr-empty">${allEntries.length ? 'No sessions match that filter.' : 'No sessions logged yet — log a set from any exercise page.'}</div>`;
        return;
      }
      filtered.forEach(e => {
        const div = document.createElement('div');
        div.className = 'grr-log-entry';
        div.innerHTML = `
          <div class="grr-log-entry-top">
            <span>${e.exercise}</span>
            <span style="display:flex;align-items:center;gap:8px;">${friendlyDate(e.date)} <span class="grr-log-delete" data-exid="${e.exId||''}" data-logid="${e.logId||''}" style="cursor:pointer;color:var(--red);font-weight:800;">✕</span></span>
          </div>
          <div class="grr-log-entry-meta">${e.pattern} · ${e.sets.map(s=>s.success?'✅':'❌').join('')} ${e.tmAction==='increase' ? '· TM increased' : ''}</div>
        `;
        container.appendChild(div);
      });
      container.querySelectorAll('.grr-log-delete').forEach(btn => {
        btn.onclick = () => {
          const exId = btn.dataset.exid, logId = btn.dataset.logid;
          if (!exId || !logId) { root.querySelector('#grr-log-msg').textContent = "Can't delete this entry (older format)."; return; }
          if (confirm('Delete this logged session? This cannot be undone.')) {
            deleteLogEntry(exId, logId);
            state.view = 'log'; render();
          }
        };
      });
    }

    root.querySelector('#grr-log-filter').oninput = (e) => { state.logFilter = e.target.value; refreshEntries(); };
    refreshEntries();

    root.querySelector('#grr-download').onclick = () => {
      try {
        const blob = new Blob([toCSV(allEntries)], {type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'gym-log.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        root.querySelector('#grr-log-msg').textContent = 'Downloaded full history.';
      } catch (err) {
        root.querySelector('#grr-log-msg').textContent = 'Download blocked here — try Copy instead.';
      }
    };
    root.querySelector('#grr-copy').onclick = async () => {
      const filtered = currentFiltered();
      const filterText = state.logFilter.trim();
      try {
        await navigator.clipboard.writeText(toCSV(filtered));
        root.querySelector('#grr-log-msg').textContent = filterText
          ? `Copied ${filtered.length} session(s) for "${filterText}".`
          : 'Copied everything — paste into a Sheet or Notes.';
      } catch (err) {
        root.querySelector('#grr-log-msg').textContent = 'Copy failed in this browser.';
      }
    };
  }

  // ---------- HOME WORKOUT HELPERS ----------
  function findMajorLiftDay(exId) {
    for (const k of Object.keys(MAJOR_LIFT_DAYS)) if (MAJOR_LIFT_DAYS[k].lift === exId) return k;
    return null;
  }
  function findLadderForExercise(exId) {
    for (const k of Object.keys(LADDERS)) {
      const idx = LADDERS[k].rungs.indexOf(exId);
      if (idx !== -1) return {key:k, idx};
    }
    return null;
  }
  function isDailySupersetExercise(exId) {
    return Object.values(MAJOR_LIFT_DAYS).some(d => d.dailySuperset.includes(exId));
  }
  function isIsolationStationExercise(exId) {
    return Object.values(CIRCUIT_DAYS).some(d => d.stations.some(s => !s.ladder && s.exercises.includes(exId)));
  }
  function isHomeWorkoutExercise(exId) {
    return !!findMajorLiftDay(exId) || !!findLadderForExercise(exId) ||
      isDailySupersetExercise(exId) || isIsolationStationExercise(exId);
  }
  let ISOLATION_STATE = {}; // { exId: {sets, weight, streak} }
  function saveIsolationState() { try { localStorage.setItem('gym-isolation-state', JSON.stringify(ISOLATION_STATE)); } catch(e){} }
  // Shared by both the Home Workout front page and the dedicated exercise detail page —
  // one implementation, so the two never drift out of sync.
  function renderMajorLiftLogger(container, dayKey, msgElId) {
    const majorDay = MAJOR_LIFT_DAYS[dayKey];
    const ex = EX_BY_ID[majorDay.lift];
    const mlState = MAJOR_LIFT_STATE[dayKey] || {sets: CIRCUIT_PARAMS.majorLift.startSets, weight: null, streak: 0, lastAmrap: null};
    const P = CIRCUIT_PARAMS.majorLift;
    let html = `<div class="grr-tm-box" style="margin-bottom:10px;"><div><label>Weight (lb, total incl. 20lb bar)</label><div style="font-size:11px;color:var(--muted);margin-top:2px;">Stage: ${mlState.sets} sets · target ${P.repCeiling}, floor ${P.repFloor}</div></div><input type="number" id="grr-ml-weight" value="${mlState.weight||''}" placeholder="e.g. 70"/></div>`;
    for (let i=1;i<=mlState.sets;i++) {
      const isAmrap = i===mlState.sets;
      html += `<div class="grr-set-row"><div class="grr-set-row-top"><span>Set ${i}${isAmrap?' (AMRAP)':''}</span><span>${isAmrap?`beat last: ${mlState.lastAmrap??'—'}`:`target ${P.repCeiling}`}</span></div><div class="grr-set-inputs"><input type="number" class="grr-ml-reps" data-i="${i}" placeholder="reps" style="width:70px;"/><span class="grr-unit">reps</span></div></div>`;
    }
    html += `<button class="grr-save-btn" id="grr-save-major">Save Major Lift</button><div class="grr-save-msg" id="${msgElId}"></div>`;
    container.innerHTML = html;
    container.querySelector('#grr-ml-weight').onchange = (e) => { mlState.weight = parseFloat(e.target.value)||null; MAJOR_LIFT_STATE[dayKey]=mlState; saveMajorLiftState(); };
    container.querySelector('#grr-save-major').onclick = () => {
      const reps = [...container.querySelectorAll('.grr-ml-reps')].map(inp => parseInt(inp.value,10)||0);
      const msgEl = container.querySelector('#'+msgElId);
      if (reps.some(r=>r<=0)) { msgEl.textContent = 'Enter a rep count for every set first.'; return; }
      const amrapReps = reps[reps.length-1];
      const allHit = reps.every(r => r >= P.repCeiling);
      let msg;
      if (allHit) {
        mlState.streak = (mlState.streak||0)+1;
        if (mlState.streak >= 2) {
          if (mlState.sets < P.maxSets) { mlState.sets += 1; mlState.streak = 0; msg = `All sets hit ${P.repCeiling} twice in a row — moving to ${mlState.sets} sets next session.`; }
          else { mlState.weight = (mlState.weight||0)+10; mlState.sets = P.startSets; mlState.streak = 0; msg = `All ${P.maxSets} sets hit ${P.repCeiling} twice in a row — weight bumped to ${mlState.weight} lb, back to ${mlState.sets} sets.`; }
        } else { msg = `All sets hit ${P.repCeiling} — one more session like this and you'll advance.`; }
      } else {
        mlState.streak = 0;
        msg = amrapReps > (mlState.lastAmrap||0) ? `Didn't hit ${P.repCeiling} on every set, but the AMRAP improved (${amrapReps} vs ${mlState.lastAmrap}).` : 'Saved — not every set hit the ceiling, no stage change.';
      }
      mlState.lastAmrap = amrapReps;
      MAJOR_LIFT_STATE[dayKey] = mlState; saveMajorLiftState();
      const entry = {date: todayLocal(), exercise: ex.n, pattern: ex.p, exId: majorDay.lift, logId: newLogId(),
        sets: reps.map((r,i)=>({target: i===reps.length-1?'AMRAP':'Set '+(i+1), weight: mlState.weight, reps:r, success: r>=P.repCeiling})),
        allSuccess: allHit, tmAction: msg.includes('bumped') ? 'increase' : 'none'};
      if (!LOGS[majorDay.lift]) LOGS[majorDay.lift]=[];
      LOGS[majorDay.lift].push(entry); saveLogs();
      msgEl.textContent = msg;
    };
  }

        circBlock.appendChild(row);
      });
    });

    function logCircuitSet(exId, ticks) {
      const ex = EX_BY_ID[exId];
      const sets = ticks.map((t,i) => ({target: 'Round '+(i+1), weight:null, reps:null, success: t===2}));
      const allSuccess = ticks.length === P.startSets && ticks.every(t => t===2);
      const entry = {date: todayLocal(), exercise: ex.n, pattern: ex.p, exId, logId: newLogId(), sets, allSuccess, tmAction:'none'};
      if (!LOGS[exId]) LOGS[exId] = [];
      LOGS[exId].push(entry);
      return allSuccess;
    }

    root.querySelector('#grr-save-circuit').onclick = () => {
      let anySaved = false;
      circuitDay.stations.forEach(station => {
        if (!station.ladder) {
          const exId = station.exercises[0];
          const ticks = CIRCUIT_TICKS[exId] || [];
          if (ticks.some(t => t > 0) && EX_BY_ID[exId]) { logCircuitSet(exId, ticks); anySaved = true; }
          return;
        }
        const exId = currentRungId(station.ladder);
        const ticks = CIRCUIT_TICKS[exId] || [];
        if (!ticks.some(t => t > 0)) return;
        const allSuccess = logCircuitSet(exId, ticks);
        anySaved = true;
        const st = RUNG_STATE[station.ladder] || {rungIndex:0, streak:0};
        if (allSuccess) {
          st.streak = (st.streak||0) + 1;
          if (st.streak >= 2 && st.rungIndex < LADDERS[station.ladder].rungs.length - 1) { st.rungIndex++; st.streak = 0; }
        } else {
          st.streak = 0;
        }
        RUNG_STATE[station.ladder] = st;
      });
      saveRungState();
      saveLogs();
      CIRCUIT_TICKS = {};
      saveCircuitTicks();
      root.querySelector('#grr-home-msg').textContent = anySaved
        ? 'Circuit session saved. Any rung that hit its ceiling on every round, twice in a row, has advanced.'
        : 'Nothing ticked yet — tap at least one round before saving.';
      render();
    };
  }

  function renderHomeCircuitDetail(x) {
    const P = CIRCUIT_PARAMS.ladder;
    const ticks = CIRCUIT_TICKS[x.id] || [];
    const hist = (LOGS[x.id] || []).slice(-5).reverse();
    const histHtml = hist.length
      ? hist.map(l => `<div class="grr-history-row"><span>${friendlyDate(l.date)}</span><span>${l.sets.map(s=>s.success?'✓':'—').join('')}</span></div>`).join('')
      : `<div style="color:var(--muted);font-size:12px;">No sessions logged yet.</div>`;

    let roundsHtml = '';
    for (let i=0; i<P.startSets; i++) {
      const tick = ticks[i] || 0;
      const label = tick === 2 ? '✓✓' : tick === 1 ? '✓' : `R${i+1}`;
      const cls = tick === 2 ? 'var(--brand)' : tick === 1 ? 'var(--steel)' : 'var(--line)';
      roundsHtml += `<button type="button" class="grr-circuit-detail-tick" data-round="${i}" style="flex:1;height:42px;border-radius:6px;border:none;background:${cls};color:#fff;font-weight:800;font-size:13px;cursor:pointer;">${label}</button>`;
    }

    root.innerHTML = `
      <div class="grr-detail">

        <div class="grr-detail-name">${x.n}</div>

        <div class="grr-section-label" style="padding-left:0;">Circuit — tap each round to log it</div>

    wireBackButtons();
    root.querySelectorAll('.grr-circuit-detail-tick').forEach(btn => {
      btn.onclick = () => {

        arr[i] = ((arr[i] || 0) + 1) % 3;
        CIRCUIT_TICKS[x.id] = arr;
        saveCircuitTicks();
        renderHomeCircuitDetail(x);
      };
    });
    root.querySelector('#grr-hd-save').onclick = () => {
      const arr = CIRCUIT_TICKS[x.id] || [];
      if (!arr.some(t => t > 0)) {
        root.querySelector('#grr-hd-msg').textContent = 'Nothing ticked yet — tap at least one round.';
        return;
      }
      const entry = {
        date: todayLocal(), exercise: x.n, pattern: x.p, exId: x.id, logId: newLogId(),
        sets: arr.map((t,i)=>({target:'Round '+(i+1), weight:null, reps:null, success:t===2})),
        allSuccess: arr.length === P.startSets && arr.every(t=>t===2), tmAction:'none'
      };
      if (!LOGS[x.id]) LOGS[x.id] = [];
      LOGS[x.id].push(entry);
      saveLogs();
      CIRCUIT_TICKS[x.id] = [];
      saveCircuitTicks();
      root.querySelector('#grr-hd-msg').textContent = 'Circuit session saved.';
      render();
    };
  }

  // ---------- RENDER: HOME WORKOUT EXERCISE DETAIL (Major Lift / Ladder rung / Isolation / Daily Superset) ----------
  function renderHomeDetail(x) {

      renderMajorLiftLogger(root.querySelector('#grr-hd-major-block'), majorKey, 'grr-hd-major-msg');
      return;
    }

    if (isSuperset) {

    if (ladderInfo) {
      const ladder = LADDERS[ladderInfo.key];
      const st = RUNG_STATE[ladderInfo.key] || {rungIndex:0, streak:0};
      const P = CIRCUIT_PARAMS.ladder;
      const rungListHtml = ladder.rungs.map((rId, i) => {
        const rEx = EX_BY_ID[rId];
        const isCurrent = i === st.rungIndex;
        return `<div class="grr-rung-row${isCurrent?' active':''}" data-idx="${i}" style="padding:8px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;background:${isCurrent?'var(--brand)':'var(--surface)'};color:${isCurrent?'#fff':'var(--chalk)'};border:1px solid ${isCurrent?'var(--brand)':'var(--line)'};font-size:12.5px;">Rung ${i+1}: ${rEx ? rEx.n : rId}${isCurrent?' (current)':''}</div>`;
      }).join('');
      const hist = (LOGS[x.id] || []).slice(-5).reverse();
      const histHtml = hist.length ? hist.map(l => `<div class="grr-history-row"><span>${friendlyDate(l.date)}</span><span>${l.sets.map(s=>s.success?'✅':'❌').join('')}</span></div>`).join('') : `<div style="color:var(--muted);font-size:12px;">No sessions logged yet.</div>`;
      let setsHtml = '';
      for (let i=1; i<=P.startSets; i++) {
        setsHtml += `<div class="grr-set-row"><div class="grr-set-row-top"><span>Round ${i}</span><span>target ${P.repCeiling}, floor ${P.repFloor}</span></div><div class="grr-set-inputs"><input type="number" class="grr-hd-reps" data-i="${i}" placeholder="reps" style="width:70px;"/><span class="grr-unit">reps</span></div></div>`;
      }
      root.innerHTML = `
        <div class="grr-detail">
          ${backButtonHtml()}
          <div class="grr-detail-name">${x.n}</div>
          <div class="grr-detail-meta">${x.p} · ${x.m} · ${ladder.label}, rung ${ladderInfo.idx+1}/${ladder.rungs.length}</div>
          ${gifBlock(x)}
          ${x.notes ? `<div class="grr-notes">${x.notes}</div>` : ''}
          <div class="grr-section-label" style="padding-left:0;">${ladder.label} — tap any rung to jump there (forward or back)</div>
          <div id="grr-rung-list" style="margin-bottom:14px;">${rungListHtml}</div>
          <div id="grr-hd-sets">${setsHtml}</div>
          <button class="grr-save-btn" id="grr-hd-save">Save Round(s)</button>
          <div class="grr-save-msg" id="grr-hd-msg"></div>
          <div class="grr-section-label" style="padding-left:0;">Recent history</div>
          <div class="grr-history">${histHtml}</div>
        </div>
      `;
      wireBackButtons();
      root.querySelectorAll('.grr-rung-row').forEach(row => {
        row.onclick = () => {
          const idx = parseInt(row.dataset.idx, 10);
          RUNG_STATE[ladderInfo.key] = {rungIndex: idx, streak: 0};
          saveRungState();
          state.homeMode = true;
          state.activeId = ladder.rungs[idx];
          render();
        };
      });
      root.querySelector('#grr-hd-save').onclick = () => {
        const reps = [...root.querySelectorAll('.grr-hd-reps')].map(inp => parseInt(inp.value,10)||0);
        if (reps.some(r=>r<=0)) { root.querySelector('#grr-hd-msg').textContent = 'Enter reps for every round first.'; return; }
        const allHit = reps.every(r => r >= P.repCeiling);
        const entry = {date: todayLocal(), exercise: x.n, pattern: x.p, exId: x.id, logId: newLogId(),
          sets: reps.map((r,i)=>({target:'Round '+(i+1), weight:null, reps:r, success: r>=P.repCeiling})), allSuccess: allHit, tmAction:'none'};
        if (!LOGS[x.id]) LOGS[x.id] = [];
        LOGS[x.id].push(entry); saveLogs();
        let msg;
        if (allHit) {
          st.streak = (st.streak||0)+1;
          if (st.streak >= 2 && st.rungIndex < ladder.rungs.length-1) {
            st.rungIndex++; st.streak = 0;
            msg = `All rounds hit ${P.repCeiling} twice in a row — advanced to rung ${st.rungIndex+1}.`;
          } else {
            msg = `All rounds hit ${P.repCeiling} — one more session like this and you'll advance.`;
          }
        } else {
          st.streak = 0;
          msg = 'Saved — not every round hit the ceiling, no rung change.';
        }
        RUNG_STATE[ladderInfo.key] = st; saveRungState();
        root.querySelector('#grr-hd-msg').textContent = msg;
        render();
      };
      return;
    }

    // Isolation stations use the exact same Home Circuit logger as every other
    // non-ladder station: rounds/ticks, no separate isolation progression.
    if (isIsolation) {
      return renderHomeCircuitDetail(x);
    }

    // Fallback — shouldn't normally hit this, but keeps the app from breaking on an unrecognized circuit exercise
    root.innerHTML = `<div class="grr-detail">${backButtonHtml()}<div class="grr-detail-name">${x.n}</div><div class="grr-empty">This exercise isn't linked into a Home Workout day yet.</div></div>`;
    wireBackButtons();
  }

  function render() {
    if (state.view === 'detail') renderDetail();
    else if (state.view === 'log') renderLog();
    else if (state.view === 'muscles') renderMuscles();
    else if (state.view === 'home') renderHome();
    else renderList();
  }

  // ---------- MUSCLE MAP ----------
  // Only muscles with a REAL, verified id in muscles.svg go here. Everything else shows in the
  // text fallback list below the diagram until you finish labeling that shape in Inkscape.
  // To add one: label the shape in Inkscape with any id, then tell me the id and I'll add the line here.
  // 7 muscles have a real `id` attribute (verified against your uploaded file). The other 21 were set via
  // Inkscape's Label field (inkscape:label) instead — a different attribute than `id`, but just as usable;
  // findMuscleEl() below checks both. All 28 are now covered.
  const MUSCLE_TO_SVG = {
    'rear-delts': {id: 'Rear_delts'},
    'transverse-abdominal': {label: 'Transverse abdominal'},
    'serratus': {label: 'Serratus'},
    'quadratus-lumborum': {label: 'Quadratus Lumborum'},
    'side-delts': {label: 'Side Delts'},
    'upper-back': {label: 'Upper Back'},
    'hip-flexors': {label: 'Hip Flexors'},
    'tibialis-anterior': {label: 'Tibialis anterior'},
    'adductors': {label: 'Adductors'},
    'lower-traps': {label: 'Lower Traps'},
    'hamstrings': {label: 'Hamstrings'},
    'mid-traps': {label: 'Mid Traps'},
    'abs': {label: 'Abs'},
    'calves': {label: 'Calves'},
    'quads': {label: 'Quads'},
    'glute-max': {label: 'Glute Max'},
    'glute-med': {label: 'Glute Med'},
    'chest': {label: 'Chest'},
    'neck': {label: 'Neck'},
    'forearms': {label: 'Forearms'},
    'biceps': {label: 'Biceps'},
    'obliques': {label: 'Obliques'},
    'front-delts': {label: 'Front Delts'},
    'triceps': {id: 'Triceps'},
    'spinal-erectors': {id: 'Spinal_erectors'},
    'upper-traps': {label: 'Upper Traps'},
    'lats': {id: 'Lats'},
    'teres-major': {id: 'Teres_Major'},
    'rhomboids': {id: 'Rhomboids'},
    'rotator-cuff': {label: 'Rotator Cuff'},
  };
  function findMuscleEl(root, spec) {
    if (spec.id) return root.querySelector('#' + CSS.escape(spec.id));
    if (spec.label) {
      const candidates = root.querySelectorAll('[inkscape\\:label]');
      for (const el of candidates) { if (el.getAttribute('inkscape:label') === spec.label) return el; }
    }
    return null;
  }
  const COUNT_MOBILITY_IN_TALLY = true; // warm-ups/stretches now count — some muscles (e.g. Serratus) are only ever hit by mobility work
  let musclesSvgLoaded = false;
  let musclesSvgMarkup = null;

  function last7DayWindow() {
    const today = new Date();
    const cutoff = new Date(today);
    cutoff.setDate(cutoff.getDate() - 6);
    cutoff.setHours(0,0,0,0);
    return cutoff;
  }

  function computeMuscleTally() {
    const cutoff = last7DayWindow();
    const tally = {};
    Object.values(LOGS).flat().forEach(entry => {
      const entryDate = new Date(entry.date + 'T00:00:00');
      if (entryDate < cutoff) return;
      const ex = EX_BY_ID[entry.exId];
      if (!ex || !ex.muscles) return;
      if (effectiveScheme(ex) === 'mobility' && !COUNT_MOBILITY_IN_TALLY) return;
      const countedSets = entry.sets.filter(s => s.target !== 'Warm-up').length || entry.sets.length;
      ex.muscles.forEach(m => {
        tally[m.id] = (tally[m.id] || 0) + (m.w * countedSets);
      });
    });
    return tally;
  }

  // Color zones are calibrated to real hypertrophy-volume research (Schoenfeld et al. 2017 dose-response
  // meta-analysis; RP volume landmarks). A "set" here means a set where that muscle is the PRIMARY mover
  // (weight 3) — secondary/tertiary involvement (weight 2/1) counts as partial credit. Points ÷ 3 ≈ sets-equivalent.
  // Red = optimal (the well-supported 15-20+ zone), not "too much" — this is a deliberate choice: red reads as
  // "goal hit" here rather than "caution."
  function setsEquivalent(points) { return points / 3; }
  function colorForScore(muscleId, n) {
    if (!n) return '#e0b3a0'; // untrained — flesh tone
    const se = setsEquivalent(n);
    const {mev, mav} = landmarksFor(muscleId);
    if (se < mev) return '#f2d43d';       // below minimum effective volume
    if (se < mav[0]) return '#a8d9a0';    // meeting minimum, not yet in the optimal band
    if (se <= mav[1]) return '#3ea86e';   // optimal — the genuine sweet spot, not just "above minimum"
    return '#c8362a';                     // past optimal — diminishing returns through excessive, one zone
  }

  async function renderMuscles() {
    root.innerHTML = `
      <div class="grr-detail">
        <span class="grr-back" id="grr-back">← Back to list</span>
        <div class="grr-detail-name">Muscle Map</div>
        <div class="grr-detail-meta" id="grr-muscle-meta">Loading…</div>
        <div id="grr-muscle-svg-wrap" style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:14px;"></div>
        <div class="grr-timer-presets" style="justify-content:flex-start;margin-bottom:6px;">
          <span class="grr-timer-chip" style="background:#e0b3a0;color:#1a1a1a;cursor:default;">Untrained</span>
          <span class="grr-timer-chip" style="background:#f2d43d;color:#1a1a1a;cursor:default;">Below minimum</span>
          <span class="grr-timer-chip" style="background:#a8d9a0;color:#1a1a1a;cursor:default;">Meeting minimum</span>
          <span class="grr-timer-chip" style="background:#3ea86e;color:#fff;cursor:default;">Optimal</span>
          <span class="grr-timer-chip" style="background:#c8362a;color:#fff;cursor:default;">Past optimal</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:14px;">Sets-equivalent per muscle over a rolling 7-day window, compared against that specific muscle's own minimum and optimal volume band (Renaissance Periodization framework, synthesized from Schoenfeld et al.'s dose-response research). Meeting the minimum isn't the same as being in the optimal range — thresholds differ by muscle, so the same number can be a different color on different muscles.</div>
        <div class="grr-section-label" style="padding-left:0;">Tap a muscle to see it, its status, and matching exercises</div>
        <div class="grr-equip-row" id="grr-muscle-row" style="padding:0 0 4px;"></div>
        <div id="grr-muscle-target-results"></div>
      </div>
    `;
    root.querySelector('#grr-back').onclick = () => { state.view = 'list'; render(); };

    const cutoffDate = last7DayWindow();
    const hasAnyLogs = Object.values(LOGS).flat().length > 0;
    root.querySelector('#grr-muscle-meta').textContent = hasAnyLogs
      ? `Rolling window: ${friendlyDate(formatDateLocal(cutoffDate))} → today`
      : 'No sessions logged yet — log a few sets to see this fill in.';

    const tally = computeMuscleTally();

    // one row per muscle: color swatch + name + current sets-equivalent + optimal target range.
    // Sorted lowest-trained first so the muscles worth attention surface at the top. Tappable,
    // same as before, to filter matching exercises below.
    // zone 0=untrained, 1=below minimum, 2=meeting minimum, 3=optimal, 4=past optimal — matches legend order
    function zoneRank(muscleId, n) {
      if (!n) return 0;
      const se = setsEquivalent(n);
      const {mev, mav} = landmarksFor(muscleId);
      if (se < mev) return 1;
      if (se < mav[0]) return 2;
      if (se <= mav[1]) return 3;
      return 4;
    }

    const muscleRow = root.querySelector('#grr-muscle-row');
    Object.keys(MUSCLE_LABELS)
      .sort((a,b) => {
        const za = zoneRank(a, tally[a]||0), zb = zoneRank(b, tally[b]||0);
        if (za !== zb) return za - zb;
        return MUSCLE_LABELS[a].localeCompare(MUSCLE_LABELS[b]);
      })
      .forEach(m => {
        const lm = landmarksFor(m);
        const se = setsEquivalent(tally[m] || 0);
        const color = colorForScore(m, tally[m] || 0);
        const chip = document.createElement('div');
        chip.className = 'grr-chip';
        chip.style.background = color;
        chip.style.color = (tally[m]||0) === 0 ? '#1a1a1a' : '#fff';
        chip.style.border = state.muscleMapTarget === m ? '2px solid var(--chalk)' : 'none';
        chip.textContent = `${MUSCLE_LABELS[m]} \u00b7 ${se.toFixed(1)} (${lm.mav[0]}\u2013${lm.mav[1]})`;
        chip.onclick = () => { state.muscleMapTarget = (state.muscleMapTarget === m) ? null : m; render(); };
        muscleRow.appendChild(chip);
      });

    const resultsWrap = root.querySelector('#grr-muscle-target-results');
    if (state.muscleMapTarget) {
      const tm = state.muscleMapTarget;
      const matches = EX.filter(x => effectiveScheme(x) !== 'circuit' && x.eq.some(e => state.equip.has(e)) && x.muscles.some(m => m.id === tm));
      matches.sort((a,b) => {
        const wa = a.muscles.find(m => m.id === tm).w;
        const wb = b.muscles.find(m => m.id === tm).w;
        return wb - wa;
      });
      resultsWrap.innerHTML = '';
      if (!matches.length) {
        resultsWrap.innerHTML = `<div class="grr-empty">No exercises match with your current equipment selection.</div>`;
      } else {
        const tierLabel = {3:'Primary mover', 2:'Secondary', 1:'Tertiary / stabilizer'};
        let lastW = null;
        matches.forEach(x => {
          const w = x.muscles.find(m => m.id === tm).w;
          if (w !== lastW) {
            const header = document.createElement('div');
            header.className = 'grr-section-label';
            header.style.padding = '10px 0 4px';
            header.textContent = `${MUSCLE_LABELS[tm]} — ${tierLabel[w]}`;
            resultsWrap.appendChild(header);
            lastW = w;
          }
          resultsWrap.appendChild(buildCard(x, {view:'muscles', muscleMapTarget: state.muscleMapTarget}));
        });
      }
    } else {
      resultsWrap.innerHTML = '';
    }

    const wrap = root.querySelector('#grr-muscle-svg-wrap');
    try {
      if (!musclesSvgLoaded) {
        const resp = await fetch('muscles.svg');
        if (!resp.ok) throw new Error('not found');
        musclesSvgMarkup = await resp.text();
        musclesSvgLoaded = true;
      }
      wrap.innerHTML = musclesSvgMarkup;
      const svgEl = wrap.querySelector('svg');
      if (svgEl) {
        svgEl.removeAttribute('width');
        svgEl.removeAttribute('height');
        svgEl.style.width = '100%';
        svgEl.style.height = 'auto';
        svgEl.style.display = 'block';
      }
      let matchedCount = 0;
      Object.entries(MUSCLE_TO_SVG).forEach(([muscleId, spec]) => {
        const el = findMuscleEl(wrap, spec);
        if (el) {
          matchedCount++;
          el.style.fill = colorForScore(muscleId, tally[muscleId] || 0);
          el.style.fillOpacity = '0.8';
        }
      });
      root.querySelector('#grr-muscle-meta').textContent += ` · ${matchedCount}/${Object.keys(MUSCLE_TO_SVG).length} regions matched`;
    } catch (err) {
      wrap.innerHTML = `<div class="grr-empty">Couldn't load muscles.svg — make sure it's uploaded in the same folder as index.html.</div>`;
    }
  }

  loadAll();
})();
</script>
</body>
</html>
